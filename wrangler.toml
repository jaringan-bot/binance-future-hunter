name = "whalescope-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Dipakai buat threshold per-pair custom (binance_set/get_pair_threshold) --
# rare write, cocok di KV. Histori time-series (basis, sinyal MM) sekarang di
# D1 (lihat [[d1_databases]] di bawah), bukan di sini lagi.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "3acf05a516874b25bef6e8151328c9ac"

# Time-series (basis snapshot + sinyal MM per watchlist, diisi Cron di
# bawah) -- pindah dari Workers KV karena limit 1.000 write/hari KV Free
# plan cuma cukup buat watchlist 3 pair; D1 (5 juta write/hari) cukup buat
# 10 pair. Migration: migrations/0001_init.sql.
[[d1_databases]]
binding = "DB"
database_name = "whalescope-mcp-db"
database_id = "3600a9bb-9261-492a-bf06-3a11b0448f4e"

# Snapshot basis + sinyal MM futures-vs-spot tiap 5 menit untuk watchlist
# (lihat src/index.ts scheduled handler) -- 1 dari maksimal 5 Cron Trigger
# di Cloudflare Free plan.
[triggers]
crons = ["*/5 * * * *"]
