name = "binance-future-hunter"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Dipakai buat threshold per-pair custom (binance_set/get_pair_threshold) --
# rare write, cocok di KV. Histori time-series (basis, sinyal MM) sekarang di
# D1 (lihat [[d1_databases]] di bawah), bukan di sini lagi.
#
# REBRAND: id di bawah masih punya akun Cloudflare lama. Fork/deploy baru
# WAJIB `npx wrangler kv namespace create WHALESCOPE_CONFIG` sendiri lalu
# ganti id ini (binding-nya biarkan CONFIG_KV) -- lihat README "Setup
# Workers KV".
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "3acf05a516874b25bef6e8151328c9ac"

# Time-series (basis snapshot + sinyal MM per watchlist, diisi Cron di
# bawah) -- pindah dari Workers KV karena limit 1.000 write/hari KV Free
# plan cuma cukup buat watchlist 3 pair; D1 (5 juta write/hari) cukup buat
# 10 pair. Migration: migrations/0001_init.sql.
#
# REBRAND (binance-future-hunter): database_id di bawah MASIH nunjuk ke D1
# lama (whalescope-mcp-db) supaya worker yang sudah live tidak putus data.
# Kalau fork/deploy ke akun Cloudflare baru, WAJIB `npx wrangler d1 create
# binance-future-hunter-db` sendiri lalu ganti database_id di bawah --
# lihat README bagian "Setup Workers D1".
[[d1_databases]]
binding = "DB"
database_name = "binance-future-hunter-db"
database_id = "3600a9bb-9261-492a-bf06-3a11b0448f4e"

# Lima Cron Trigger -- akun ini sudah di Workers PAID plan, jadi limit slot
# jauh di atas 5 (bekas batasan Free plan yang mendasari komentar lama di
# sini), dibedakan lewat event.cron di src/index.ts scheduled handler:
# - */5: snapshot basis + sinyal MM futures-vs-spot untuk watchlist, plus
#   prune request_log & wall_tracking.
# - */1: scan wall kandidat order book untuk watchlist (wall_tracking, D1)
#   -- lebih sering karena wall bisa hilang dalam hitungan menit.
# - */15: snapshot posisi wallet whale Hyperliquid (HYPERLIQUID_WHALE_WATCHLIST,
#   shared.ts) ke hyperliquid_whale_snapshots -- posisi whale gak berubah
#   secepat orderbook/funding, 15 menit cukup, hemat fetch budget.
# - 7-59/15 (tiap 15 menit, OFFSET dari dua cron di atas -- fire di menit
#   7,22,37,52): entry alert Telegram top-200 pair (entryAlertCron.ts) --
#   offset SENGAJA supaya gak numpuk di tick yang sama dengan snapshot */5
#   (pipeline penuh 200 pair jauh lebih berat call-nya daripada basis
#   snapshot). Pakai range-step, BUKAN comma-list -- comma-list ("7,22,37,52")
#   keterima saat registrasi tapi gak pernah beneran fire (lihat komentar
#   ENTRY_ALERT_CRON di src/index.ts).
# - 0 0,8,16 * * * (00.00/08.00/16.00 UTC = 07.00/15.00/23.00 WIB):
#   heartbeatCron.ts -- kalau 8 jam terakhir gak ada alert TRADE/WATCH sama
#   sekali, kirim 1 pesan yang jelasin kenapa (market sepi vs backend
#   bermasalah, dari tally entry_alert_run_log). User request 2026-08-25.
[triggers]
crons = ["*/5 * * * *", "*/1 * * * *", "*/15 * * * *", "7-59/15 * * * *", "0 0,8,16 * * *"]

# Default Workers Paid subrequest budget (10.000/invocation) kena di
# entryAlertCron.ts (2026-08-25, live via wrangler tail): 400 pair x call
# asli per symbol (termasuk retry fetchWithRetry + 3-tier failover
# binanceProxyClient.ts) ternyata ~34/symbol, bukan cuma 12-17 teoritis --
# budget abis di sekitar symbol ke-295, sisanya gagal "Too many
# subrequests by single Worker invocation". Subrequest COUNT yang jadi
# bottleneck di kejadian itu, bukan compute, jadi aman dinaikkan tinggi.
#
# CPU time vs wall-clock -- DUA limit terpisah buat Cron Trigger di Workers
# Paid, JANGAN ketuker (komentar versi sebelumnya di sini salah nyampur
# keduanya): cap CPU time buat cron interval < 1 jam (SEMUA 5 cron di
# [triggers] atas ini `*/1`/`*/5`/`*/15`) itu 30 DETIK -- 15 menit cuma
# berlaku buat cron interval >= 1 jam. Cap 15 menit yang beneran kena di
# sini adalah WALL-CLOCK (durasi invocation dari cron fire sampai
# ctx.waitUntil() kelar), limit terpisah dari CPU time.
# Sample nyata 500-pair via wrangler tail (2026-08-27, ENTRY_ALERT_CRON):
# cpuTime 11.86 detik (~40% dari cap 30 detik CPU) -- headroom REAL jauh
# lebih tipis dari ~18 detik "jauh dari 15 menit" yang diklaim sebelumnya,
# karena cap-nya emang bukan 15 menit. wallTime 12m13.5s (~81% dari cap
# 15 menit wall-clock) -- INI constraint yang lebih ketat secara praktis,
# bukan CPU time maupun subrequest count. Baru 1 sample live, belum
# dipantau across multiple tick -- jangan anggap ini angka pasti/stabil.
[limits]
subrequests = 20000
