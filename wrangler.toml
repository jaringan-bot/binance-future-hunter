name = "whalescope-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Dipakai buat threshold per-pair custom (binance_set/get_pair_threshold) dan
# histori basis time-series (binance_get_basis_history, diisi Cron di bawah).
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "3acf05a516874b25bef6e8151328c9ac"

# Snapshot basis futures-vs-spot tiap 5 menit untuk watchlist (lihat
# src/index.ts scheduled handler) -- 1 dari maksimal 5 Cron Trigger di
# Cloudflare Free plan.
[triggers]
crons = ["*/5 * * * *"]
