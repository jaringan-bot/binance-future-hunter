name = "whalescope-mcp"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

# Dipakai buat threshold per-pair custom (binance_set/get_pair_threshold) --
# rare write, cocok di KV. Histori time-series (basis, sinyal MM) sekarang di
# D1 (lihat [[d1_databases]] di bawah), bukan di sini lagi.
[[kv_namespaces]]
binding = "CONFIG_KV"
id = "3acf05a516874b25bef6e8151328c9ac"

# Time-series (basis snapshot + sinyal MM per watchlist, diisi Cron di
# bawah) -- pindah dari Workers KV karena limit 1.000 write/hari KV Free
# plan cuma cukup buat watchlist 3 pair; D1 (5 juta write/hari) cukup buat
# 10 pair. Migration: migrations/0001_init.sql.
[[d1_databases]]
binding = "DB"
database_name = "whalescope-mcp-db"
database_id = "3600a9bb-9261-492a-bf06-3a11b0448f4e"

# Empat Cron Trigger -- akun ini sudah di Workers PAID plan, jadi limit slot
# jauh di atas 5 (bekas batasan Free plan yang mendasari komentar lama di
# sini), dibedakan lewat event.cron di src/index.ts scheduled handler:
# - */5: snapshot basis + sinyal MM futures-vs-spot untuk watchlist, plus
#   prune request_log & wall_tracking.
# - */1: scan wall kandidat order book untuk watchlist (wall_tracking, D1)
#   -- lebih sering karena wall bisa hilang dalam hitungan menit.
# - */15: snapshot posisi wallet whale Hyperliquid (HYPERLIQUID_WHALE_WATCHLIST,
#   shared.ts) ke hyperliquid_whale_snapshots -- posisi whale gak berubah
#   secepat orderbook/funding, 15 menit cukup, hemat fetch budget.
# - 7-59/15 (tiap 15 menit, OFFSET dari dua cron di atas -- fire di menit
#   7,22,37,52): entry alert Telegram top-200 pair (entryAlertCron.ts) --
#   offset SENGAJA supaya gak numpuk di tick yang sama dengan snapshot */5
#   (pipeline penuh 200 pair jauh lebih berat call-nya daripada basis
#   snapshot). Pakai range-step, BUKAN comma-list -- comma-list ("7,22,37,52")
#   keterima saat registrasi tapi gak pernah beneran fire (lihat komentar
#   ENTRY_ALERT_CRON di src/index.ts).
[triggers]
crons = ["*/5 * * * *", "*/1 * * * *", "*/15 * * * *", "7-59/15 * * * *"]

# Default Workers Paid subrequest budget (10.000/invocation) kena di
# entryAlertCron.ts (2026-08-25, live via wrangler tail): 400 pair x call
# asli per symbol (termasuk retry fetchWithRetry + 3-tier failover
# binanceProxyClient.ts) ternyata ~34/symbol, bukan cuma 12-17 teoritis --
# budget abis di sekitar symbol ke-295, sisanya gagal "Too many
# subrequests by single Worker invocation". CPU time invocation itu cuma
# ~18 detik (jauh dari cap 15 menit CPU cron) -- subrequest COUNT yang
# jadi bottleneck, bukan compute, jadi aman dinaikkan tinggi.
[limits]
subrequests = 20000
